<style>

    --bg:#F7F6F4;--panel:#FFFFFF;--panel2:#FBFAF8;--ink:#1C1A18;--gray:#6B6660;--mute:#A6A09A;
    --line:#E6E3E0;--line2:#EFEDEA;--faint:#D5D1CD;

    --weekend:#F1EFEC;--sel:#EFEAE1;--block-trip:#E6EEF3;--block-fam:#E6F0E9;

  }
  :root[data-theme="dark"]{

    document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();

<body>
<div id="root"><div id="loader"><span>PER DIEM</span></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script type="text/babel">
const {useState,useMemo,useRef,useEffect}=React;

/* ════════════════════════════════════════════════════════════
   PER DIEM — draw-first planning surface.
   State axis: Marked → Requested → Scheduled → Worked. Subscribed
   calendar feeds (webcal) carry the official schedule in, auto-promote
   the days she requested, and flag the ones she never asked for.
   The calendar is the work surface; the readout below it is the
   per-day picker/editor. Hours-missed comes from one engine wired
   to Wake / Bed / School-Start / School-End.
   ════════════════════════════════════════════════════════════ */

const V=k=>`var(--${k})`;
const C={ink:V("ink"),bg:V("bg"),panel:V("panel"),panel2:V("panel2"),line:V("line"),line2:V("line2"),
  gray:V("gray"),mute:V("mute"),faint:V("faint"),ocean:V("ocean"),juniper:V("juniper"),danger:V("danger"),
  weekend:V("weekend"),sel:V("sel"),blockTrip:V("block-trip"),blockFam:V("block-fam"),warn:V("warn"),bar:V("bar"),
  shiftDay:V("shift-day"),shiftNight:V("shift-night"),away:V("away"),awaySoft:V("away-soft")};
const MONO="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,monospace";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// today comes off the device clock — the app opens on the real current month
const TODAY=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());})();
const TODAY_S=`${TODAY.getFullYear()}-${String(TODAY.getMonth()+1).padStart(2,'0')}-${String(TODAY.getDate()).padStart(2,'0')}`;
const YEAR=TODAY.getFullYear();

/* ─── dates ─── */
const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const ad=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const mk=s=>s.slice(0,7);                         // month key YYYY-MM
const fmt$=v=>"$"+Math.round(v).toLocaleString();
const fmtK=v=>"$"+(Math.round(v/100)/10).toLocaleString()+"k";
const fmtH=v=>(Math.round(v*10)/10)+"h";
const parseHM=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||""));return m?Math.min(24,(+m[1])+(+m[2])/60):0;};
const hm=h=>`${String(Math.floor(h)).padStart(2,"0")}:${String(Math.round((h%1)*60)).padStart(2,"0")}`;
const ovl=(a,b,c,d)=>Math.max(0,Math.min(b,d)-Math.max(a,c));   // overlap of [a,b] & [c,d]
const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));

/* ─── shift catalog: a shift is (start, duration); night = overnight start ─── */
const SHIFTS=[
  {id:"d6", start:"06:00",hours:8, night:false,label:"6a · 8h"},
  {id:"d7", start:"07:00",hours:8, night:false,label:"7a · 8h"},
  {id:"d10",start:"10:00",hours:8, night:false,label:"10a · 8h"},
  {id:"d11",start:"11:00",hours:8, night:false,label:"11a · 8h"},
  {id:"n22",start:"22:00",hours:8, night:true, label:"10p · 8h"},
  {id:"n23",start:"23:00",hours:8, night:true, label:"11p · 8h"},
  {id:"D7", start:"07:00",hours:12,night:false,label:"7a · 12h"},
  {id:"N19",start:"19:00",hours:12,night:true, label:"7p · 12h"},
];
const SHIFT_BY=Object.fromEntries(SHIFTS.map(s=>[s.id,s]));
const REACH_LABEL={local:"local",nm:"NM",rural_nm:"rural NM"};
const LOC_NAME={boston:"Boston",santa_fe:"Santa Fe",abq:"Albuquerque",montana:"Montana",portland:"Portland"};
const CAL_KINDS=["school","holiday","event","custom"];
const WORK_FACTORS=[["colocate","co-locate (work locally)"],["commute","commute (leave to work)"],["closed","closed (no work)"]];
const CAL_COLORS=[["juniper","var(--juniper)"],["ocean","var(--ocean)"],["ink","var(--ink)"],["gray","var(--gray)"],["clay","var(--bar)"]];
// per-reach default travel bracket: days out before / back after the shift block
const TRAVEL_DEFAULT={
  local:   {beforeDays:0,departTime:"06:00",afterDays:0,returnTime:"20:00"},
  nm:      {beforeDays:1,departTime:"15:00",afterDays:1,returnTime:"13:00"},
  rural_nm:{beforeDays:1,departTime:"11:00",afterDays:1,returnTime:"13:00"},
};

/* ════════ SEED ════════ */
function seedState(){
  const sites=[
    {id:"boston",  name:"BMC South",     reach:"local",   menu:[{shift:"d7",rate:245},{shift:"d6",rate:245},{shift:"d10",rate:245},{shift:"d11",rate:245},{shift:"n22",rate:290},{shift:"n23",rate:290}], travel:TRAVEL_DEFAULT.local},
    {id:"santa_fe",name:"Santa Fe ED",   reach:"nm",      menu:[{shift:"d7",rate:170},{shift:"N19",rate:210}], travel:{beforeDays:1,departTime:"16:00",afterDays:1,returnTime:"13:00"}},
    {id:"abq",     name:"Albuquerque ED",reach:"nm",      menu:[{shift:"d7",rate:285},{shift:"n23",rate:305}], travel:{beforeDays:1,departTime:"15:00",afterDays:1,returnTime:"13:00"}},
    {id:"gallup",  name:"Silver City ED",reach:"rural_nm",menu:[{shift:"D7",rate:300},{shift:"N19",rate:335}], travel:{beforeDays:1,departTime:"11:00",afterDays:1,returnTime:"13:00"}},
  ];
  const trips=[
    {id:"t1",name:"Santa Fe summer",from:"2026-08-01",to:"2026-08-21",loc:"santa_fe",workFactor:"colocate",visible:true},
    {id:"t2",name:"Montana cabin",  from:"2026-07-04",to:"2026-07-12",loc:"montana", workFactor:"commute", visible:true},
    {id:"t3",name:"Japan",          from:"2026-09-12",to:"2026-09-26",loc:"boston",  workFactor:"closed",   visible:true},
  ];
  const calendars=[
    {id:"jun",name:"Juni (BISB)",kind:"school",color:"var(--juniper)",visible:true,
     ranges:[{from:"2026-06-18",to:"2026-08-23",label:"Summer"},{from:"2026-11-25",to:"2026-11-27",label:"Thanksgiving"},
       {from:"2026-12-21",to:"2027-01-03",label:"Winter Break"}]},
    {id:"oce",name:"Ocean (SolBe)",kind:"school",color:"var(--ocean)",visible:true,
     ranges:[{from:"2026-08-22",to:"2026-08-31",label:"Between schools"}]},
    {id:"hol",name:"Holidays",kind:"holiday",color:"var(--ink)",visible:true,
     ranges:[{from:"2026-07-04",to:"2026-07-04",label:"July 4"},{from:"2026-09-07",to:"2026-09-07",label:"Labor Day"},
       {from:"2026-11-26",to:"2026-11-26",label:"Thanksgiving"},{from:"2026-12-25",to:"2026-12-25",label:"Christmas"}]},
    {id:"camp",name:"Summer camp",kind:"custom",color:"var(--bar)",visible:true,out:{start:"09:00",end:"15:00",weekdaysOnly:true},
     ranges:[{from:"2026-07-06",to:"2026-08-14",label:"Day camp"}]},
  ];
  // Lydia's real S-PHY shifts → Boston, scheduled. Past ones read as worked.
  const LYDIA=[["2026-06-03","day"],["2026-06-05","day"],["2026-06-06","day"],["2026-06-09","day"],
    ["2026-06-13","day"],["2026-06-15","day"],["2026-06-16","day"],["2026-06-23","night"],["2026-06-24","night"],
    ["2026-06-27","day"],["2026-06-30","day"],["2026-07-07","day"],["2026-07-08","day"],["2026-07-30","day"]];
  let n=0;
  const shifts=LYDIA.map(([date,t])=>({id:"L"+(++n),date,siteId:"boston",type:t,
    status:date<TODAY_S?"worked":"scheduled",coLocated:false}));
  // a couple of requested shifts at travel sites, to show the readout's reach/co-location affordances
  shifts.push({id:"P1",date:"2026-07-14",siteId:"abq",   type:"day",  status:"requested",coLocated:false});
  shifts.push({id:"P2",date:"2026-07-15",siteId:"abq",   type:"day",  status:"requested",coLocated:false});
  shifts.push({id:"P3",date:"2026-08-12",siteId:"santa_fe",type:"day",status:"requested",coLocated:false});
  // days she's marked as "I could work this" — not asked for yet
  shifts.push({id:"M1",date:"2026-10-06",siteId:"boston",type:"day",  status:"marked",coLocated:false});
  shifts.push({id:"M2",date:"2026-10-07",siteId:"boston",type:"night",status:"marked",coLocated:false});
  // a scheduled remote cluster (ABQ) so real travel days bookend it out of the box
  shifts.push({id:"S1",date:"2026-09-29",siteId:"abq",type:"day",status:"scheduled",coLocated:false});
  shifts.push({id:"S2",date:"2026-09-30",siteId:"abq",type:"day",status:"scheduled",coLocated:false});
  // 2026 catch-up: per-month earned override for the pre-app months
  const monthOverrides={"2026-01":7600,"2026-02":9200,"2026-03":12400,"2026-04":10800,"2026-05":8800};
  const settings={wake:"07:00",bed:"20:00",schoolStart:"08:00",schoolEnd:"15:00",goal:220000};
  // a held window at a travel site: hold 7 days (incl. a weekend), work 2; a travel day bookends it
  const windows=[{id:"w1",siteId:"santa_fe",type:"day",from:"2026-10-17",to:"2026-10-23",x:2}];
  const aways=[{id:"a1",date:"2026-09-28",kind:"travel"},{id:"a2",date:"2026-07-13",kind:"away"}];   // manually-placed demo days
  return {sites,trips,calendars,shifts,monthOverrides,settings,windows,aways,
    feeds:[],surprises:[],feedIgnore:[],travelMigrated:true,phaseMigrated:true};
}

/* ════════ ENGINE ════════ */
const siteIndex=sites=>Object.fromEntries(sites.map(s=>[s.id,s]));
const autoCode=site=>(site?site.name:"?").replace(/ ED$/,"").split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase();
const siteCode=site=>(site&&site.code)?site.code:autoCode(site);   // a site's short badge: hand-set, else initials
// a menu entry carries its own editable start/hours/rate; the catalog only supplies defaults for old entries
const HM_RE=/^\d{1,2}:\d{2}$/;
const entryStartStr=e=>{const t=e&&e.start;return HM_RE.test(t)?t:(SHIFT_BY[e&&e.shift]||SHIFT_BY.d7).start;};
const entryHours=e=>Number.isFinite(e&&e.hours)?e.hours:(SHIFT_BY[e&&e.shift]||SHIFT_BY.d7).hours;
const entryNight=e=>{const h=parseHM(entryStartStr(e));return h>=18||h<5;};   // night = evening/overnight start
const fmtClock=t=>{const v=parseHM(t),h=Math.floor(v),mm=Math.round((v-h)*60),ap=h>=12?"p":"a";let hh=h%12;if(!hh)hh=12;return hh+(mm?":"+String(mm).padStart(2,"0"):"")+ap;};
const entryLabel=e=>`${fmtClock(entryStartStr(e))} · ${entryHours(e)}h`;
function resolveEntry(site,type){
  const menu=(site&&site.menu)||[{shift:"d7",rate:0}];
  if(type==="day")  return menu.find(e=>!entryNight(e))||menu[0];
  if(type==="night")return menu.find(e=> entryNight(e))||menu[0];
  return menu.find(e=>e.shift===type)||menu[0];
}
const isCat=t=>t==="day"||t==="night";              // coarse type vs a specific catalog id
const shiftCat=(site,type)=>entryNight(resolveEntry(site,type))?"night":"day";
const specificType=(site,type)=>isCat(type)?resolveEntry(site,type).shift:type;   // coarse → representative specific shift
function shiftInterval(site,type){            // [startHour, endHour] within the day
  const e=resolveEntry(site,type),start=parseHM(entryStartStr(e));
  return [start,start+entryHours(e)];
}
function shiftPay(site,type){const e=resolveEntry(site,type);return (+e.rate||0)*entryHours(e);}
/* a single shift may carry its own start/hours — that's how a feed-imported shift
   keeps the exact times the schedule published, while still billing at the site's rate */
function entryFor(site,sh){
  const base=resolveEntry(site,sh&&sh.type);if(!sh)return base;
  const o={...base};let over=false;
  if(HM_RE.test(sh.start)){o.start=sh.start;over=true;}
  if(Number.isFinite(sh.hours)&&sh.hours>0){o.hours=sh.hours;over=true;}
  return over?o:base;
}
const shiftIntervalOf=(site,sh)=>{const e=entryFor(site,sh),st=parseHM(entryStartStr(e));return [st,st+entryHours(e)];};
const shiftPayOf=(site,sh)=>{const e=entryFor(site,sh);return (+e.rate||0)*entryHours(e);};
const shiftCatOf=(site,sh)=>entryNight(entryFor(site,sh))?"night":"day";
const shiftLabelOf=(site,sh)=>entryLabel(entryFor(site,sh));

const isWeekend=str=>{const g=pd(str).getDay();return g===0||g===6;};
const calCovers=(cal,str)=>(cal.ranges||[]).some(r=>str>=r.from&&str<=r.to);
const visCals=state=>(state.calendars||[]).filter(c=>c.visible!==false);
// a school break / holiday means no school that day (kids home)
const onSchoolBreak=(str,state)=>visCals(state).some(c=>(c.kind==="school"||c.kind==="holiday")&&calCovers(c,str));
// the intervals a kid is OUT of the house on a date: school hours (school days) + any camp/activity out-window
function outIntervals(str,state){
  const s=state.settings,wd=!isWeekend(str),out=[];
  if(wd&&!onSchoolBreak(str,state))out.push([parseHM(s.schoolStart),parseHM(s.schoolEnd)]);
  visCals(state).forEach(c=>{if(c.out&&c.out.start&&c.out.end&&(c.out.weekdaysOnly===false||wd)&&calCovers(c,str))out.push([parseHM(c.out.start),parseHM(c.out.end)]);});
  return out.filter(([a,b])=>b>a);
}
// kids home all day = nothing pulls them out (weekend/break with no camp)
const homeAllDay=(str,state)=>outIntervals(str,state).length===0;
// subtract [a,b] from a set of [x,y] intervals
function cutInterval(ivs,a,b){const out=[];ivs.forEach(([x,y])=>{if(b<=x||a>=y){out.push([x,y]);return;}if(x<a)out.push([x,a]);if(b<y)out.push([b,y]);});return out.filter(([x,y])=>y>x);}
// kid-home-&-awake intervals: the awake window minus every out-of-house interval
function homeAwake(str,state){
  const s=state.settings,wake=parseHM(s.wake),bed=parseHM(s.bed);
  if(bed<=wake)return [];
  let free=[[wake,bed]];
  outIntervals(str,state).forEach(([a,b])=>{free=cutInterval(free,clamp(a,wake,bed),clamp(b,wake,bed));});
  return free;
}
const dayAwakeHours=(str,state)=>homeAwake(str,state).reduce((t,[a,b])=>t+(b-a),0);
// hours a single shift's DAY misses kid-home-awake time:
//  · remote & not co-located → you're in another city all day → the full home-awake hours
//  · local, or co-located (kids came along) → only the shift's clock-hours overlap; home before/after
// (travel days are counted separately in travelBand.)
function shiftMissed(shift,state,sIdx){
  const site=sIdx[shift.siteId];if(!site)return 0;
  if(site.reach!=="local"&&!shift.coLocated)return dayAwakeHours(shift.date,state);
  const [a,b]=shiftIntervalOf(site,shift),aw=homeAwake(shift.date,state);
  let t=0;for(const [x,y] of aw)t+=ovl(a,Math.min(b,24),x,y);
  return Math.round(t*10)/10;
}
/* ─── the four phases ───────────────────────────────────────────────────────
   marked     — a day she's holding: "I could work this." Nothing asked for yet.
   requested  — submitted to the scheduler. Money counts only "if it lands".
   scheduled  — on the official schedule (usually confirmed by a calendar feed).
   worked     — scheduled and now in the past. Carries actuals.
   A scheduled day rolls to worked on its own once the date passes.          */
const PHASES=["marked","requested","scheduled","worked"];
const PHASE_LABEL={marked:"Marked",requested:"Requested",scheduled:"Scheduled",worked:"Worked"};
const PHASE_SHORT={marked:"Mark",requested:"Req",scheduled:"Sched",worked:"Worked"};
const PHASE_ORDER={marked:0,requested:1,scheduled:2,worked:3};
const isSketch=st=>st==="marked"||st==="requested";           // the un-committed layer
const isWorked=sh=>sh.status==="worked"||(sh.status==="scheduled"&&sh.date<TODAY_S);
const bucketOf=sh=>{const st=PHASES.includes(sh.status)?sh.status:"requested";
  if(st==="scheduled"&&sh.date<TODAY_S)return "worked";
  if(st==="worked"&&sh.date>=TODAY_S)return "scheduled";      // a worked day dragged forward
  return st;};
// worked shifts can carry hand-edited actuals; otherwise fall back to the planned value
const missedOf=(sh,state,sIdx)=>(isWorked(sh)&&Number.isFinite(sh.actualMissed))?sh.actualMissed:shiftMissed(sh,state,sIdx);
const payOf=(sh,sIdx)=>(isWorked(sh)&&Number.isFinite(sh.actualPay))?sh.actualPay:shiftPayOf(sIdx[sh.siteId],sh);
// scheduled days whose date has passed become worked, in the store, not just on screen
function rollWorked(shifts){return (shifts||[]).map(s=>
  s.status==="scheduled"&&s.date<TODAY_S?{...s,status:"worked"}
  :s.status==="worked"&&s.date>=TODAY_S?{...s,status:"scheduled"}:s);}
// soft warnings — never block, just flag an odd state in a colour
function warnOf(sh,state){
  const trip=(state.trips||[]).find(t=>t.visible!==false&&t.workFactor==="closed"&&sh.date>=t.from&&sh.date<=t.to);
  if(trip)return "on a closed trip ("+trip.name+")";
  if(isSketch(bucketOf(sh))&&sh.date<TODAY_S)return PHASE_LABEL[bucketOf(sh)].toLowerCase()+" but already in the past";
  return null;
}

/* ─── windows: a held span where you'll work X of Y days (ratio sites) ─── */
const winDates=w=>{const out=[];for(let d=pd(w.from);d<=pd(w.to);d=ad(d,1))out.push(ds(d));return out;};
function windowBrackets(w,sIdx){            // provisional travel days outside the window, for remote sites
  const site=sIdx[w.siteId];if(!site||site.reach==="local")return {before:[],after:[]};
  const tv=site.travel||TRAVEL_DEFAULT[site.reach]||TRAVEL_DEFAULT.local,before=[],after=[];
  for(let i=(tv.beforeDays||0);i>=1;i--)before.push(ds(ad(pd(w.from),-i)));
  for(let i=1;i<=(tv.afterDays||0);i++)after.push(ds(ad(pd(w.to),i)));
  return {before,after};
}
// date → {wid,kind:"span"|"travel"} for every day a window touches
function winBand(windows,sIdx){
  const map={};
  (windows||[]).forEach(w=>{
    winDates(w).forEach(dt=>{map[dt]={w,kind:"span"};});
    const b=windowBrackets(w,sIdx);[...b.before,...b.after].forEach(dt=>{if(!map[dt])map[dt]={w,kind:"travel"};});
  });
  return map;
}
// a held window's impact band: min/max kid-awake hours missed + provisional travel
function windowBand(w,state,sIdx){
  const site=sIdx[w.siteId],dates=winDates(w),Y=dates.length,X=clamp(w.x||1,1,Y);
  const perDay=dates.map(dt=>shiftMissed({date:dt,siteId:w.siteId,type:w.type,coLocated:false},state,sIdx)).sort((a,b)=>a-b);
  const lo=perDay.slice(0,X).reduce((a,b)=>a+b,0),hi=perDay.slice(Y-X).reduce((a,b)=>a+b,0);

const shiftKey=sh=>(sh&&sh.source)?feedKey(sh.source.feedId,sh.source.uid,sh.date):null;
const ignoreShift=(state,sh)=>{const k=shiftKey(sh);
  return k?{...state,feedIgnore:[...(state.feedIgnore||[]).filter(x=>x!==k),k].slice(-500)}:state;};
const clearIgnores=(state,feedId)=>({...state,feedIgnore:(state.feedIgnore||[]).filter(k=>k.split("|")[0]!==feedId)});
const ignoredCount=(state,feedId)=>(state.feedIgnore||[]).filter(k=>k.split("|")[0]===feedId).length;
function surpriseOf(feed,kind,date,sh,from,label){
  return {id:`x_${feed.id}_${kind}_${date}_${hash36((sh&&sh.source&&sh.source.uid)||date)}`,
    feedId:feed.id,feed:feed.name,date,kind,siteId:sh?sh.siteId:null,
    uid:(sh&&sh.source&&sh.source.uid)||null,
    start:(sh&&sh.start)||null,hours:(sh&&Number.isFinite(sh.hours))?sh.hours:null,
    label:String(label||(sh&&sh.label)||""),from:from||null,at:new Date().toISOString()};
}

/* ─── the reconcile itself: pure, idempotent, safe to run on every check ───
   Returns the next state plus a report of what moved. `flag:false` (a feed's
   very first pull) adopts the schedule silently instead of flagging all of it. */
function reconcile(state,sIdx,feed,parsed,nowStr,opts){
  const flag=!(opts&&opts.flag===false);
  const events=(parsed&&parsed.events)||[];
  const rep={promoted:0,updated:0,added:0,moved:0,dropped:0,locked:0,ignored:0,extra:(parsed&&parsed.extra)||0,surprises:[]};
  if(!events.length)return {state,report:rep};
  let shifts=state.shifts.slice();
  const mine=sh=>!!(sh.source&&sh.source.feedId===feed.id);
  const ignored=new Set(state.feedIgnore||[]);
  const held=str=>(state.windows||[]).some(w=>str>=w.from&&str<=w.to);
  const flagIt=(kind,date,sh,from,label)=>{if(flag&&date>=nowStr)rep.surprises.push(surpriseOf(feed,kind,date,sh,from,label));};

  events.forEach(ev=>{
    if(monthLocked(state,ev.date)){rep.locked++;return;}          // a frozen catch-up month stays frozen
    if(ignored.has(feedKey(feed.id,ev.uid,ev.date))){rep.ignored++;return;}   // she threw this one back
    const onDay=shifts.find(s=>s.date===ev.date);
    const byUid=shifts.find(s=>mine(s)&&s.source.uid===ev.uid);
    const patch=feedShift(ev,state,sIdx,feed,onDay?onDay.siteId:(byUid?byUid.siteId:null));
    const phase=ev.date<nowStr?"worked":"scheduled";
    if(onDay){
      if(byUid&&byUid!==onDay)shifts=shifts.filter(s=>s!==byUid);   // it folded onto a day already spoken for
      const was=bucketOf(onDay),next={...onDay,...patch,status:phase};
      shifts=shifts.map(s=>s===onDay?next:s);
      if(was==="requested")rep.promoted++;
      else if(was==="marked"){rep.promoted++;flagIt("unrequested",ev.date,patch);}
      // a re-check that lands on the same values is not news — only count a real edit
      else if(JSON.stringify(next)!==JSON.stringify(onDay))rep.updated++;
    }else if(byUid){
      const from=byUid.date;
      shifts=shifts.map(s=>s===byUid?{...byUid,...patch,status:phase}:s);
      rep.moved++;flagIt("moved",ev.date,patch,from);
    }else{
      shifts=shifts.concat([{id:"f"+hash36(feed.id+ev.uid+ev.date),coLocated:false,...patch,status:phase}]);
      rep.added++;flagIt(held(ev.date)?"unrequested":"new",ev.date,patch);
    }
  });

  // shifts this feed placed that have since vanished from the span it publishes
  const dates=events.map(e=>e.date).sort(),lo=dates[0],hi=dates[dates.length-1];
  const uids=new Set(events.map(e=>e.uid)),days=new Set(dates);
  const gone=shifts.filter(s=>mine(s)&&s.date>=nowStr&&s.date>=lo&&s.date<=hi&&!uids.has(s.source.uid)&&!days.has(s.date));
  if(gone.length){
    const ids=new Set(gone.map(s=>s.id));
    shifts=shifts.filter(s=>!ids.has(s.id));
    rep.dropped=gone.length;
    gone.forEach(s=>flagIt("dropped",s.date,s));
  }
  // a placed travel/away day can't share a date with a shift
  const taken=new Set(shifts.map(s=>s.date));
  const aways=(state.aways||[]).filter(a=>!taken.has(a.date));
  return {state:{...state,shifts,aways},report:rep};
}
const reportEmpty=r=>!r||(!r.promoted&&!r.added&&!r.moved&&!r.dropped&&!r.updated);
function reportLine(r){
  const bits=[];
  if(r.promoted)bits.push(`${r.promoted} confirmed`);
  if(r.added)bits.push(`${r.added} new`);
  if(r.moved)bits.push(`${r.moved} moved`);
  if(r.dropped)bits.push(`${r.dropped} dropped`);
  if(!bits.length&&r.updated)bits.push(`${r.updated} updated`);
  if(r.locked)bits.push(`${r.locked} skipped (locked month)`);
  return bits.join(" · ")||"no changes";
}
// merge a check's flags into the plan, skipping any she's already been shown
function withSurprises(state,list){
  const seen=new Set((state.surprises||[]).map(x=>x.id));
  const add=(list||[]).filter(x=>!seen.has(x.id));
  if(!add.length)return state;
  return {...state,surprises:[...(state.surprises||[]),...add].slice(-200)};
}
/* When a device last checked a feed — and how it went — is that device's
   business, not the plan's. Keeping it out of the shared document means an
   idle hourly check never writes, so the other phone isn't woken by a sync
   that carries no actual news. */
const FEED_ST="pdFeedStatus";
function loadFeedStatus(){try{const v=JSON.parse(localStorage.getItem(FEED_ST)||"{}");return (v&&typeof v==="object")?v:{};}catch(e){return {};}}
function saveFeedStatus(v){try{localStorage.setItem(FEED_ST,JSON.stringify(v));}catch(e){}}
const feedDue=(f,st)=>{const at=st&&st.at?Date.parse(st.at):0;
  return !at||(Date.now()-at)>=clamp(Math.round(+f.every||60),15,1440)*60000;};
const ackSurprises=(state,ids)=>({...state,surprises:(state.surprises||[]).filter(x=>ids.indexOf(x.id)<0)});
// "I didn't agree to this" — drop the flagged shift out of the plan along with the
// flag, and remember not to take it back on the next check
function rejectSurprise(state,x){
  const hit=state.shifts.find(s=>s.date===x.date&&s.source&&s.source.feedId===x.feedId);
  const next={...state,
    shifts:state.shifts.filter(s=>s!==hit),
    surprises:(state.surprises||[]).filter(y=>y.id!==x.id)};
  return ignoreShift(next,hit||(x.uid?{date:x.date,source:{feedId:x.feedId,uid:x.uid}}:null));
}

/* pull a feed's text: through the NAS proxy when one is connected (feed hosts
   send no CORS headers), else straight at it in case this one does. */
async function fetchFeedText(feed,cfg){
  const url=feedURL(feed.url),errs=[];
  if(cfg&&cfg.url){
    try{
      const h=cfg.tok?{Authorization:"Bearer "+cfg.tok}:{};
      const r=await fetch(`${cfg.url}/ics?url=${encodeURIComponent(url)}`,{headers:h,cache:"no-store"});
      if(r.ok)return await r.text();
      let msg="HTTP "+r.status;
      try{const j=await r.json();if(j&&j.error)msg=j.error;}catch(_){}
      errs.push("via shared storage: "+msg);
    }catch(e){errs.push("via shared storage: "+(e.message||e));}
  }
  try{
    const r=await fetch(url,{cache:"no-store"});
    if(r.ok)return await r.text();
    errs.push("direct: HTTP "+r.status);
  }catch(e){errs.push(cfg&&cfg.url?"direct: blocked by the browser":"direct: blocked by the browser — connect shared storage so the NAS can fetch it");}
  throw new Error(errs.join(" · "));
}

/* ─── desktop strip view: each month is one weekday-aligned row of squares (Lydia's view), zoomable ─── */
const CAL_LBL=58,CAL_RG=4,STRIP_COLS=37,WK="SMTWTFS";

const Nub=({side,onDown})=><span onPointerDown={onDown} style={{position:"absolute",top:0,bottom:0,[side]:-4,width:11,zIndex:7,

function StripCell({str,cell,ml,state,sIdx,selected,win,travel,preview,placing,selTrip,selWin,onEdge,onGrabTravel,onTap,onDown,onEnter}){

  const cals=visCals(state).filter(c=>calCovers(c,str));
  let bg=C.panel,border=`1px solid ${C.line2}`,op=1,filled=false;

  if(trip)bg=C.blockTrip;else if(allDay)bg=C.weekend;
  if(showTravel)bg=awayDay?C.away:C.panel;          // away day = Prussian blue fill; travel day punches through
  if(win&&win.kind==="span")bg=C.sel;if(preview||placing)bg=C.sel;
  const warn=shift?warnOf(shift,state):null;
  if(shift){const cat=shiftCatOf(sIdx[shift.siteId],shift),status=bucketOf(shift),col=siteShiftCol(sIdx[shift.siteId],cat);
    if(phaseFilled(status)){bg=col;border=`1px solid ${col}`;op=status==="worked"?0.6:1;filled=true;}
    else{border=`1.5px ${PHASE_DASH[status]} ${col}`;op=status==="marked"?0.75:1;}}

    style={{...base,background:bg,border:placing?`1.5px dashed ${C.ocean}`:(ringCol&&!shift)?`1.5px ${(showTravel||(win&&win.kind==="travel"))?"dashed":"solid"} ${ringCol}`:border,
      outline:selected?`2px solid ${C.ink}`:"none",outlineOffset:-1,opacity:locked?0.4:op,touchAction:(onDown||grabTravel)?"none":"auto",cursor:grabTravel?"grab":"pointer",

    {showTravel&&<span style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:Math.max(9,Math.round(cell*0.5)),color:awayDay?"#fff":C.ocean,lineHeight:1}}>{awayDay?"☾":"✈"}</span>}

      {cals.slice(0,3).map((c,i)=><span key={i} style={{flex:1,background:c.color}}/>)}</div>}

    {selTrip&&selTrip.to===str&&<Nub side="right" onDown={e=>onEdge("trip",selTrip.id,"end",e)}/>}
    {selWin&&selWin.from===str&&<Nub side="left" onDown={e=>onEdge("window",selWin.id,"start",e)}/>}
    {selWin&&selWin.to===str&&<Nub side="right" onDown={e=>onEdge("window",selWin.id,"end",e)}/>}

  const chip={fontFamily:MONO,fontSize:10.5,fontWeight:700,cursor:"pointer",borderRadius:13,padding:"2px 8px",display:"inline-flex",alignItems:"center",gap:5,background:C.panel};
  const sw=col=><span style={{width:9,height:9,borderRadius:3,background:col,flexShrink:0}}/>;
  const key=(col,lab)=><span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:10,color:C.gray}}>{sw(col)}{lab}</span>;
  return <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",padding:"0 12px 7px"}}>
    <button onClick={()=>setOpen(o=>!o)} style={{border:"none",background:"transparent",color:C.mute,cursor:"pointer",fontFamily:MONO,
      fontSize:9.5,fontWeight:800,letterSpacing:"0.05em",textTransform:"uppercase"}}>{open?"▾":"▸"} calendars</button>
    {open&&state.calendars.map(c=>{const on=c.visible!==false;
      return <button key={c.id} onClick={()=>toggle(c.id)} title={`${(c.ranges||[]).length} ranges${c.out?` · out ${c.out.start}–${c.out.end}`:""}`}
        style={{...chip,border:`1px solid ${on?c.color:C.line}`,opacity:on?1:0.45,color:C.ink}}>
        {sw(c.color)}<span>{c.name}</span>{!on&&<span style={{color:C.mute}}>off</span>}</button>;})}
    {open&&<span style={{width:1,height:14,background:C.line2,margin:"0 1px"}}/>}
    {open&&key(C.shiftDay,"day")}{open&&key(C.shiftNight,"night")}{open&&key(C.blockTrip,"trip")}
    {open&&<span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:10,color:C.ocean}}>✈ travel</span>}
    {open&&<span style={{width:1,height:14,background:C.line2,margin:"0 1px"}}/>}

function CalendarSurface({state,sIdx,mobile,mutate,viewY,viewM,setView,tool,setTool,selected,onTap,onUndo,canUndo,winBy,travelBy,placing,onCreateWindow,selTid,selWid,onEdge,onGrabTravel}){
  const tools=[["select","⌖","Select"],["mark","✎","Mark"],["request","▲","Request"],["window","▭","Window"],
    ["schedule","◆","Schedule"],["travel","✈","Travel"],["away","☾","Away"],["erase","⌫","Erase"]];

  const selWin=selWid&&(state.windows||[]).find(w=>w.id===selWid)||null;
  const [cell,setCell]=useState(()=>{try{const v=+localStorage.getItem("perDiemZoom");return v>=12&&v<=42?v:18;}catch(e){return 18;}});   // strip zoom, remembered
  useEffect(()=>{try{localStorage.setItem("perDiemZoom",cell);}catch(e){}},[cell]);
  const cg=Math.max(1,Math.round(cell/9)),wg=Math.max(2,Math.round(cell/3));
  const step=n=>{let m=viewM+n,y=viewY;if(m<0){m=11;y--;}if(m>11){m=0;y++;}setView(y,m);};
  const [drag,setDrag]=useState(null);

    const set=new Set();for(let d=pd(a);d<=pd(b);d=ad(d,1))set.add(ds(d));return set;},[drag]);
  useEffect(()=>{if(!drag)return;
    // track the finger across days: on touch, pointerenter doesn't fire on siblings, so hit-test by point
    const move=e=>{const el=document.elementFromPoint(e.clientX,e.clientY),hit=el&&el.closest&&el.closest("[data-date]");
      if(hit){const dt=hit.getAttribute("data-date");setDrag(d=>(d&&d.over!==dt)?{...d,over:dt}:d);}};
    const up=()=>{const a=drag.anchor<drag.over?drag.anchor:drag.over,b=drag.anchor<drag.over?drag.over:drag.anchor;onCreateWindow(a,b);setDrag(null);};

              <Btn small disabled={cell<=12} onClick={()=>setCell(c=>Math.max(12,c-3))}>−</Btn>
              <Btn small disabled={cell>=42} onClick={()=>setCell(c=>Math.min(42,c+3))}>＋</Btn>
            </div>}
      </div>

      {tool==="erase"&&<div style={{fontSize:10.5,color:C.gray,padding:"0 12px 5px"}}>

    </div>
  </div>;
}

/* shift picker keyed to lifecycle: marked/requested = Day/Night + the specific list; scheduled = specific only */
function ShiftSelect({site,type,coarse,compact,onChange}){
  const style={...inp,...(compact?{flex:1,minWidth:0}:{maxWidth:240})};
  const opts=site.menu.map(m=><option key={m.shift} value={m.shift}>{entryLabel(m)} · {entryNight(m)?"Night":"Day"}</option>);
  if(coarse){
    const val=isCat(type)?type:(site.menu.some(m=>m.shift===type)?type:"day");

      <option value="day">Day (any)</option><option value="night">Night (any)</option>
      {opts}</select>;

// marked → requested → scheduled, with the last slot reading "worked" on a past day

  const items=[["marked","Marked"],["requested","Requested"],past?["worked","Worked"]:["scheduled","Scheduled"]];
  return <>{items.map(([ph,lab])=><Btn key={ph} small={small} on={status===ph} onClick={()=>onSet(ph)}

function SitesTab({state,mutate}){

    if(!confirm(`Delete ${site.name}?`+((nS||nW)?` This also removes ${nS} shift(s) and ${nW} window(s) at this site.`:"")))return;
    mutate(s=>({...s,sites:s.sites.filter(x=>x.id!==sid),shifts:s.shifts.filter(x=>x.siteId!==sid),windows:(s.windows||[]).filter(w=>w.siteId!==sid)}));};

          <input value={s.code||""} placeholder={autoCode(s)} maxLength={4} onChange={e=>setSiteF(s.id,{code:e.target.value.toUpperCase()||undefined})} style={{...inp,width:54,padding:"3px 6px",textAlign:"center",fontWeight:700}}/></label>
        <select value={s.reach} onChange={e=>setReach(s.id,e.target.value)} style={{...inp,width:"auto",padding:"4px 6px",fontSize:11.5}}>

          <input type="color" value={s.dayColor||DEF_DAY} onChange={e=>setSiteF(s.id,{dayColor:e.target.value})} style={{width:26,height:22,padding:0,border:`1px solid ${C.line}`,borderRadius:4,cursor:"pointer"}}/></label>

          <label style={{fontSize:10.5,color:C.gray}}>days back<br/><NumInput value={tv.afterDays} min="0" onChange={v=>setTravel(s.id,{afterDays:Math.max(0,Math.round(v))})} style={{...inp,width:54,padding:"3px 6px"}}/></label>

        </div>;})()}

function AddShift({avail,onAdd}){

/* ════════ FEEDS TAB — subscribed calendar links ════════ */
function FeedRow({feed,state,mutate,onCheck,busy,onPaste,status}){
  const [paste,setPaste]=useState(false),[txt,setTxt]=useState("");
  const setF=patch=>mutate(s=>({...s,feeds:(s.feeds||[]).map(f=>f.id===feed.id?{...f,...patch}:f)}));
  const rm=()=>{
    const n=state.shifts.filter(x=>x.source&&x.source.feedId===feed.id).length;
    if(!confirm(`Remove “${feed.name}”?`+(n?` The ${n} shift(s) it brought in stay on the calendar, just unlinked.`:"")))return;
    mutate(s=>({...s,feeds:(s.feeds||[]).filter(f=>f.id!==feed.id),
      shifts:s.shifts.map(x=>{if(!x.source||x.source.feedId!==feed.id)return x;const y={...x};delete y.source;return y;}),
      surprises:(s.surprises||[]).filter(x=>x.feedId!==feed.id)}));
  };
  const busyLabel=busy==="checking"?"checking…":null;
  const ignores=ignoredCount(state,feed.id);
  const st=status||{};
  const when=st.at?new Date(st.at).toLocaleString():null;
  return <div style={{border:`1px solid ${C.line2}`,borderRadius:8,padding:"9px 10px",marginBottom:8}}>
    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:6}}>
      <span style={{fontSize:12,color:feed.enabled!==false?C.juniper:C.mute}}>⟳</span>
      <input value={feed.name} onChange={e=>setF({name:e.target.value})} style={{...inp,flex:"1 1 130px",minWidth:0,padding:"4px 7px",fontWeight:700}}/>
      <Chip on={feed.enabled!==false} onClick={()=>setF({enabled:!(feed.enabled!==false)})}>{feed.enabled!==false?"on":"paused"}</Chip>
      <Btn small disabled={!!busyLabel} onClick={()=>onCheck(feed)}>{busyLabel||"check now"}</Btn>
      <button onClick={rm} title="remove feed" style={delBtn}>✕</button>
    </div>
    <input value={feed.url} onChange={e=>setF({url:e.target.value})} spellCheck={false}
      style={{...inp,padding:"4px 7px",fontSize:10.5,color:C.gray}}/>
    <div style={{display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap",marginTop:7}}>
      <label style={{fontSize:10.5,color:C.gray}}>shifts land at<br/>
        <select value={feed.siteId} onChange={e=>setF({siteId:e.target.value})} style={{...inp,width:"auto",padding:"3px 6px",fontSize:11.5}}>
          {state.sites.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></label>
      <label style={{fontSize:10.5,color:C.gray}}>check<br/>
        <select value={feed.every} onChange={e=>setF({every:+e.target.value})} style={{...inp,width:"auto",padding:"3px 6px",fontSize:11.5}}>
          {FEED_EVERY.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></label>
      <button onClick={()=>setPaste(x=>!x)} style={{...addBtn,padding:"4px 8px"}}>{paste?"close paste":"paste .ics"}</button>
    </div>
    <div style={{fontSize:10,marginTop:7,color:st.ok===false?C.danger:C.mute,lineHeight:1.45}}>
      {st.ok===false
        ? <>✗ last check failed — {st.err}</>
        : when
        ? <>✓ checked {when}{Number.isFinite(st.count)?` · ${st.count} shift${st.count===1?"":"s"} in the feed`:""}</>
        : <>never checked on this device — it'll pull within the minute, or hit “check now”.</>}
      <span style={{color:C.mute}}> · this device only</span>
    </div>
    {ignores>0&&<div style={{fontSize:10,color:C.mute,marginTop:4,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
      <span>{ignores} shift{ignores===1?"":"s"} you dropped stay off the calendar.</span>
      <button onClick={()=>mutate(s=>clearIgnores(s,feed.id))} style={{...addBtn,padding:"2px 7px",fontSize:10}}>let them back</button></div>}
    {paste&&<div style={{marginTop:6}}>
      <div style={{fontSize:10,color:C.gray,marginBottom:3}}>Open the link in a browser, copy the whole file, paste it here — same reconcile, no network needed.</div>
      <textarea value={txt} onChange={e=>setTxt(e.target.value)} placeholder="BEGIN:VCALENDAR …" style={{...inp,height:80,fontSize:11,resize:"vertical"}}/>
      <button onClick={()=>{onPaste(feed,txt);setTxt("");setPaste(false);}} style={{...addBtn,marginTop:4}}>reconcile this text</button>
    </div>}
  </div>;
}
function FeedsTab({state,mutate,onCheck,onPaste,busy,status,hasStore,onOpenStore}){
  const [url,setUrl]=useState(""),[name,setName]=useState("");
  const add=()=>{
    if(!isFeedURL(url)){alert("That doesn’t look like a calendar link — it should start with webcal:// or https://");return;}
    const id="f"+Date.now().toString(36),u=url.trim();
    mutate(s=>({...s,feeds:[...(s.feeds||[]),{id,name:name.trim()||feedHost(u),url:u,siteId:s.sites[0].id,
      enabled:true,every:60}]}));
    setUrl("");setName("");
  };
  const feeds=state.feeds||[];
  return <div style={{padding:"16px 16px 60px",overflow:"auto",maxWidth:720}}>
    <div style={{fontSize:11,color:C.gray,lineHeight:1.55,marginBottom:12}}>
      Subscribe to the calendar link your scheduler publishes — ShiftAdmin's “<b>webcal://…schedule_ical.php…</b>” link, or any
      .ics URL. Per Diem checks it on a timer and folds it into the plan: days you <b>requested</b> that come back on the feed
      become <b>scheduled</b> by themselves, and anything scheduled that you never asked for gets flagged.
    </div>
    {!hasStore&&<div style={{border:`1px solid ${C.warn}`,borderRadius:8,padding:"9px 11px",marginBottom:12,fontSize:11,color:C.ink,lineHeight:1.5}}>
      <b style={{color:C.warn}}>⚠ Connect shared storage first.</b> Scheduler sites don’t allow a browser to read their
      calendars directly, so the NAS service fetches them for you. Without it a check will fail — or you can paste the
      .ics text into a feed by hand.
      <div style={{marginTop:6}}><Btn small onClick={onOpenStore}>open shared storage</Btn></div>
    </div>}
    {feeds.map(f=><FeedRow key={f.id} feed={f} state={state} mutate={mutate} onCheck={onCheck} onPaste={onPaste}
      busy={busy[f.id]} status={status[f.id]}/>)}
    <div style={{border:`1px dashed ${C.faint}`,borderRadius:8,padding:"10px 11px",marginTop:4}}>
      <div style={{fontSize:9.5,fontWeight:800,letterSpacing:"0.05em",textTransform:"uppercase",color:C.mute,marginBottom:6}}>Add a calendar link</div>
      <input value={url} onChange={e=>setUrl(e.target.value)} spellCheck={false}
        placeholder="webcal://www.shiftadmin.com/schedule_ical.php?cd=v2&u=…" style={{...inp,fontSize:11,marginBottom:6}}/>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="name it (optional)" style={{...inp,flex:"1 1 140px",minWidth:0,fontSize:11.5}}/>
        <Btn kind="prim" onClick={add}>+ subscribe</Btn>
      </div>
    </div>
  </div>;
}

      <div style={{padding:"16px 18px 10px",borderBottom:`1px solid ${C.line2}`}}>

        <div style={{fontSize:11.5,color:C.gray,lineHeight:1.5}}>
          {news>0?"These landed on the official schedule without a request from you — days you hadn’t asked for, or that moved. ":""}

      </div>
      <div style={{overflow:"auto",padding:"8px 12px",flex:1}}>
        {list.map(x=>{const site=sIdx[x.siteId],d=pd(x.date),gone=x.kind==="dropped";
          return <div key={x.id} style={{display:"flex",gap:9,alignItems:"flex-start",padding:"9px 6px",borderBottom:`1px solid ${C.line2}`}}>
            <span style={{fontSize:13,color:gone?C.mute:C.warn,width:14,textAlign:"center",flexShrink:0,marginTop:1}}>{SURPRISE_ICON[x.kind]}</span>
            <div style={{flex:1,minWidth:0}}>
              <button onClick={()=>onGo(x.date)} style={{fontFamily:MONO,fontSize:12.5,fontWeight:800,border:"none",background:"transparent",
                color:C.ink,cursor:"pointer",padding:0,textDecoration:"underline",textDecorationColor:C.faint}}>
                {DOW[d.getDay()]} {MON[d.getMonth()]} {d.getDate()}</button>
              <span style={{fontSize:11,color:C.gray,marginLeft:7}}>
                {site?siteCode(site):"?"}{x.start?` · ${fmtClock(x.start)}${Number.isFinite(x.hours)?` · ${x.hours}h`:""}`:""}</span>
              <div style={{fontSize:10.5,color:C.gray,marginTop:2,lineHeight:1.4}}>
                {SURPRISE_TEXT[x.kind]}{x.from?` (was ${MON[pd(x.from).getMonth()]} ${pd(x.from).getDate()})`:""}
                {x.label?<span style={{color:C.mute}}> · {x.label}</span>:null}
                {x.feed?<span style={{color:C.mute}}> · {x.feed}</span>:null}</div>
            </div>
            <div style={{display:"flex",gap:5,flexShrink:0}}>
              <Btn small onClick={()=>onKeep(x)}>{gone?"ok":"keep"}</Btn>
              {!gone&&<Btn small onClick={()=>onDrop(x)} title="take it back off the calendar">drop</Btn>}
            </div>
          </div>;})}
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",padding:"10px 16px",borderTop:`1px solid ${C.line2}`}}>
        <span style={{fontSize:10,color:C.mute,flex:1}}>Dropping only removes it here — it stays on the official schedule.</span>
        <Btn onClick={onClose}>later</Btn><Btn kind="prim" onClick={onKeepAll}>keep all</Btn>
      </div>
    </div>
  </div>;
}

/* ════════ SHARED STORAGE (NAS over Tailscale) ════════ */
const SYNC_UI={off:{c:"mute",t:"off"},connecting:{c:"ocean",t:"connecting…"},synced:{c:"juniper",t:"synced"},
  saving:{c:"ocean",t:"saving…"},offline:{c:"mute",t:"offline"},error:{c:"danger",t:"error"}};
function SyncModal({sync,onClose,onSaved}){
  const c=syncCfg()||{url:"",tok:"",id:"shared"};
  const [url,setUrl]=useState(c.url),[tok,setTok]=useState(c.tok),[id,setId]=useState(c.id||"shared"),[test,setTest]=useState(null);
  const norm=()=>({url:url.trim().replace(/\/+$/,""),tok:tok.trim(),id:id.trim()||"shared"});
  const save=()=>{const n=norm();try{if(n.url)localStorage.setItem(SYNC_URL,n.url);else localStorage.removeItem(SYNC_URL);
    localStorage.setItem(SYNC_TOK,n.tok);localStorage.setItem(SYNC_ID,n.id);}catch(e){}onSaved();onClose();};
  const disconnect=()=>{try{localStorage.removeItem(SYNC_URL);localStorage.removeItem(SYNC_TOK);}catch(e){}onSaved();onClose();};
  const doTest=async()=>{setTest("testing…");try{const r=await remoteGet(norm());
    setTest(`✓ reached · rev ${r.rev}${r.updatedAt?" · saved "+new Date(r.updatedAt).toLocaleString():" · empty (first save creates it)"}`);}
    catch(e){setTest("✗ "+(e.message||e)+" — check the URL, that you're on the tailnet, and CORS/token");}};
  return <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:700,background:"rgba(0,0,0,.4)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{fontFamily:MONO,color:C.ink,background:C.panel,borderRadius:10,padding:"18px 20px",maxWidth:460,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.35)"}}>
      <div style={{fontSize:15,fontWeight:800,marginBottom:2}}>Shared storage</div>
      <div style={{fontSize:11.5,color:C.gray,lineHeight:1.5,marginBottom:8}}>
        Point this device at your NAS store, reached over Tailscale. Saved only here — the address never goes into the site.
        You both enter the same URL + workspace to share a living plan.
      </div>
      <Field label="Endpoint URL"><input style={inp} value={url} placeholder="https://nas.your-tailnet.ts.net" onChange={e=>setUrl(e.target.value)}/></Field>
      <div style={{display:"flex",gap:10}}>
        <div style={{flex:1}}><Field label="Workspace"><input style={inp} value={id} onChange={e=>setId(e.target.value)}/></Field></div>
        <div style={{flex:1}}><Field label="Token (optional)"><input style={inp} type="password" value={tok} onChange={e=>setTok(e.target.value)}/></Field></div>
      </div>
      {test&&<div style={{fontSize:10.5,marginTop:2,marginBottom:4,lineHeight:1.4,color:/^✓/.test(test)?C.juniper:(/^testing/.test(test)?C.gray:C.danger)}}>{test}</div>}
      <div style={{display:"flex",gap:8,marginTop:12,alignItems:"center",flexWrap:"wrap"}}>
        <Btn onClick={doTest}>test</Btn><div style={{flex:1}}/>
        {syncCfg()&&<Btn kind="danger" onClick={disconnect}>disconnect</Btn>}
        <Btn onClick={onClose}>cancel</Btn><Btn kind="prim" onClick={save}>connect</Btn>
      </div>
      {sync&&sync.status==="error"&&sync.err&&<div style={{fontSize:10,color:C.danger,marginTop:8}}>last error: {sync.err}</div>}
    </div>
  </div>;
}

/* ════════ APP ════════ */
function App(){
  const [state,setState]=useState(load);
  const past=useRef([]);
  const [canUndo,setCanUndo]=useState(false);
  const [panel,setPanel]=useState(null);     // null = calendar; else "trips"|"sites"|"earnings"|"family"
  const [menu,setMenu]=useState(false);      // hamburger overlay
  const [collapsed,setCollapsed]=useState(false);   // info box collapsed
  const [tool,setTool]=useState("select");
  const [selected,setSelected]=useState(TODAY_S);
  const [selWid,setSelWid]=useState(null);
  const [selTid,setSelTid]=useState(null);
  const [[viewY,viewM],setVY]=useState([TODAY.getFullYear(),TODAY.getMonth()]);   // opens on the current month
  const [lastSite,setLastSite]=useState("boston");
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem("perDiemTheme")||"system";}catch(e){return "system";}});
  const [mobile,setMobile]=useState(()=>typeof window!=="undefined"&&window.matchMedia&&window.matchMedia("(max-width:760px)").matches);
  const [tripDrag,setTripDrag]=useState(null);   // grabbing a trip from the drawer to place on the calendar
  const [cfg,setCfg]=useState(()=>syncCfg());    // shared-storage endpoint (per-device)
  const [feedBusy,setFeedBusy]=useState({});     // feedId → "checking"
  const [feedStatus,setFeedStatus]=useState(loadFeedStatus);   // per-device check results
  const [snooze,setSnooze]=useState("");         // the surprise set she's already looked at
  const [sync,setSync]=useState(()=>({status:syncCfg()?"connecting":"off"}));
  const [syncModal,setSyncModal]=useState(false);
  const remoteJson=useRef(null),rev=useRef(0),saveTimer=useRef();

  useEffect(()=>{try{localStorage.setItem("perDiemNext",JSON.stringify(state));}catch(e){}},[state]);
  useEffect(()=>{const m=window.matchMedia&&window.matchMedia("(max-width:760px)");if(!m)return;
    const h=()=>setMobile(m.matches);m.addEventListener&&m.addEventListener("change",h);return ()=>m.removeEventListener&&m.removeEventListener("change",h);},[]);
  useEffect(()=>{const mq=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
    const apply=()=>{const eff=theme==="system"?((mq&&mq.matches)?"dark":"light"):theme;document.documentElement.setAttribute("data-theme",eff);};
    apply();try{localStorage.setItem("perDiemTheme",theme);}catch(e){}
    if(theme==="system"&&mq&&mq.addEventListener){mq.addEventListener("change",apply);return ()=>mq.removeEventListener("change",apply);}},[theme]);

  const mutate=updater=>setState(s=>{past.current.push(s);if(past.current.length>50)past.current.shift();setCanUndo(true);return updater(s);});
  const undo=()=>{if(!past.current.length)return;const prev=past.current.pop();setCanUndo(past.current.length>0);setState(prev);};
  const setView=(y,m)=>setVY([y,m]);

  const sIdx=useMemo(()=>siteIndex(state.sites),[state.sites]);
  const winBy=useMemo(()=>winBand(state.windows,sIdx),[state.windows,sIdx]);
  const travelBy=useMemo(()=>travelBand(state),[state.shifts,state.aways]);
  const viewYM=`${viewY}-${String(viewM+1).padStart(2,"0")}`;
  const agg=useMemo(()=>aggregate(state,sIdx,viewYM),[state,sIdx,viewYM]);

  // drawing a shift over a window replaces the window (a day is either held or drawn, never both)
  const dropWinAt=(s,str)=>s.windows.filter(w=>!(str>=w.from&&str<=w.to));
  const onTap=str=>{
    if(tool==="window")return;   // window tool builds via drag, not tap
    if(monthLocked(state,str)){setSelected(str);setSelWid(null);setSelTid(null);const d0=pd(str);setVY([d0.getFullYear(),d0.getMonth()]);return;}   // frozen month
    const ex=state.shifts.find(s=>s.date===str);
    const draw=(status,type)=>mutate(s=>({...s,windows:dropWinAt(s,str),aways:(s.aways||[]).filter(a=>a.date!==str),
      shifts:[...s.shifts,{id:"s"+Date.now(),date:str,siteId:lastSite,type,status,coLocated:false}]}));
    if(tool==="mark"){
      if(!ex)draw("marked","day");
    }else if(tool==="request"){
      // draw-to-request: lifts a marked day, or drops a fresh request
      if(ex){if(bucketOf(ex)==="marked")mutate(s=>({...s,shifts:s.shifts.map(x=>x.id===ex.id?{...x,status:"requested"}:x)}));}
      else draw("requested","day");
    }else if(tool==="schedule"){
      // draw-to-schedule: commits a marked/requested day in place, or drops a fresh scheduled one
      if(ex)mutate(s=>({...s,shifts:s.shifts.map(x=>x.id===ex.id?{...x,status:str<TODAY_S?"worked":"scheduled",type:specificType(sIdx[x.siteId],x.type)}:x)}));
      else draw(str<TODAY_S?"worked":"scheduled",specificType(sIdx[lastSite],"day"));
    }else if(tool==="travel"||tool==="away"){
      if(!ex)mutate(s=>addAway(s,str,tool));   // place a single travel/away day on this day
    }else if(tool==="erase"){
      // erase the sketch layer: a marked/requested shift, then a placed away/travel day, then a window
      if(ex&&isSketch(bucketOf(ex)))mutate(s=>({...s,shifts:s.shifts.filter(x=>x.id!==ex.id)}));
      else if(travelBy[str])mutate(s=>rmAwayAt(s,str));
      else {const w=(state.windows||[]).find(w=>str>=w.from&&str<=w.to);if(w)mutate(s=>({...s,windows:s.windows.filter(x=>x.id!==w.id)}));}
    }
    setSelected(str);
    const w=winBy[str];
    if(travelBy[str]){setSelWid(null);setSelTid(null);}             // travel day wins (even over a trip it sits on) → its own readout
    else if(w){setSelWid(w.w.id);setSelTid(null);}                  // window day → select window
    else{setSelWid(null);                                           // trip day (select mode, no shift) → select trip
      const tp=(tool==="select"&&!ex)?(state.trips||[]).find(t=>t.visible!==false&&str>=t.from&&str<=t.to):null;
      setSelTid(tp?tp.id:null);}
    const d=pd(str);setVY([d.getFullYear(),d.getMonth()]);   // focus the banner's month on the tapped day
  };
  const onCreateWindow=React.useCallback((from,to)=>{
    if(to<TODAY_S)return;                         // windows are future intent — ignore an all-past drag
    if(from<TODAY_S)from=TODAY_S;                 // trim a window that starts in the past
    const id="w"+Date.now(),span=Math.round((pd(to)-pd(from))/864e5)+1;
    mutate(s=>({...s,windows:[...(s.windows||[]),{id,siteId:lastSite,type:"day",from,to,x:clamp(Math.round(span/2),1,span)}]}));
    setSelWid(id);setSelTid(null);setSelected(from);const d=pd(from);setVY([d.getFullYear(),d.getMonth()]);
    setTool("select");   // window is one-shot — revert to select so the next drag doesn't make another
  },[lastSite]);
  // create a window from the info box (no drag): a default span starting on the selected day
  const addWindowAt=date=>{let from=date<TODAY_S?TODAY_S:date;const to=ds(ad(pd(from),4)),id="w"+Date.now();
    mutate(s=>({...s,windows:[...(s.windows||[]),{id,siteId:lastSite,type:"day",from,to,x:2}]}));
    setSelWid(id);setSelTid(null);setSelected(from);const d=pd(from);setVY([d.getFullYear(),d.getMonth()]);};
  // grab a trip from the drawer and drop it on a day: sets its start, keeps its duration; edits sync with the tab
  const placeTrip=(id,from,dur)=>{mutate(s=>({...s,trips:s.trips.map(t=>t.id===id?{...t,from,to:ds(ad(pd(from),Math.max(0,dur))),visible:true}:t)}));
    setSelTid(id);setSelWid(null);setSelected(from);const d=pd(from);setVY([d.getFullYear(),d.getMonth()]);};
  const toggleTripVis=id=>mutate(s=>({...s,trips:s.trips.map(t=>t.id===id?{...t,visible:t.visible===false}:t)}));
  const beginTripDrag=(t,e)=>setTripDrag({id:t.id,name:t.name,dur:Math.round((pd(t.to)-pd(t.from))/864e5),sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,over:null,moved:false});
  useEffect(()=>{if(!tripDrag)return;
    const move=e=>setTripDrag(d=>{if(!d)return d;const el=document.elementFromPoint(e.clientX,e.clientY),hit=el&&el.closest&&el.closest("[data-date]");
      return {...d,x:e.clientX,y:e.clientY,over:hit?hit.getAttribute("data-date"):null,moved:d.moved||Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>4};});
    const up=()=>{const d=tripDrag;if(d){if(d.moved&&d.over)placeTrip(d.id,d.over,d.dur);else if(!d.moved)toggleTripVis(d.id);}setTripDrag(null);};
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
    return ()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);};},[tripDrag]);
  // drag a travel day to another (empty) day — stores a per-trip date override
  const [travelDrag,setTravelDrag]=useState(null);
  const beginTravelDrag=(info,e)=>{e.stopPropagation();setTravelDrag({id:info.id,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,over:null,moved:false});};
  useEffect(()=>{if(!travelDrag)return;
    const move=e=>setTravelDrag(d=>{if(!d)return d;const el=document.elementFromPoint(e.clientX,e.clientY),hit=el&&el.closest&&el.closest("[data-date]");
      return {...d,x:e.clientX,y:e.clientY,over:hit?hit.getAttribute("data-date"):null,moved:d.moved||Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>4};});
    const up=()=>{const d=travelDrag;if(d&&d.moved&&d.over){mutate(s=>moveAway(s,d.id,d.over));setSelWid(null);setSelTid(null);setSelected(d.over);}setTravelDrag(null);};
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
    return ()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);};},[travelDrag]);
  const placingSet=useMemo(()=>{
    if(tripDrag&&tripDrag.moved&&tripDrag.over){const set=new Set();for(let i=0;i<=tripDrag.dur;i++)set.add(ds(ad(pd(tripDrag.over),i)));return set;}
    if(travelDrag&&travelDrag.moved&&travelDrag.over)return new Set([travelDrag.over]);
    return null;},[tripDrag,travelDrag]);
  // edge-resize a selected trip or window by dragging its end handle; one undo entry per resize
  const [edgeDrag,setEdgeDrag]=useState(null);
  const beginEdge=(kind,id,edge,e)=>{e.stopPropagation();past.current.push(state);if(past.current.length>50)past.current.shift();setCanUndo(true);setEdgeDrag({kind,id,edge});};
  useEffect(()=>{if(!edgeDrag)return;const {kind,id,edge}=edgeDrag;
    const move=e=>{const el=document.elementFromPoint(e.clientX,e.clientY),hit=el&&el.closest&&el.closest("[data-date]");if(!hit)return;const over=hit.getAttribute("data-date");
      setState(s=>kind==="trip"
        ? {...s,trips:s.trips.map(t=>t.id!==id?t:edge==="start"?{...t,from:over<=t.to?over:t.to}:{...t,to:over>=t.from?over:t.from})}
        : {...s,windows:s.windows.map(w=>{if(w.id!==id)return w;const nw=edge==="start"?{...w,from:over<=w.to?over:w.to}:{...w,to:over>=w.from?over:w.from};
            nw.x=clamp(w.x||1,1,Math.round((pd(nw.to)-pd(nw.from))/864e5)+1);return nw;})});};
    const up=()=>setEdgeDrag(null);
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
    return ()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);};},[edgeDrag]);
  // keep lastSite synced to the selected day's shift / window, so new draws inherit context
  useEffect(()=>{const w=selWid&&(state.windows||[]).find(x=>x.id===selWid);
    const sh=state.shifts.find(s=>s.date===selected);
    if(w)setLastSite(w.siteId);else if(sh)setLastSite(sh.siteId);},[selected,selWid,state.shifts,state.windows]);

  const MENU_SECTIONS=[["trips","✈ Trips"],["sites","⌂ Sites"],["feeds","⟳ Calendar feeds"],
    ["earnings","$ Earnings settings"],["family","☺ Family time settings"]];
  const PANEL_TITLE={trips:"Trips",sites:"Sites",feeds:"Calendar feeds",earnings:"Earnings settings",family:"Family time settings"};
  const openPanel=p=>{setPanel(p);setMenu(false);};
  const themeIcon={system:"◐",light:"☀",dark:"☾"}[theme];
  const cycle=()=>setTheme(t=>t==="system"?"light":t==="light"?"dark":"system");
  const fileRef=useRef();
  const [toast,setToast]=useState(null);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),4000);return ()=>clearTimeout(t);},[toast]);
  // ── shared storage: initial pull (or create), debounced push, poll for the other device ──
  const applyRemote=v=>{past.current=[];setCanUndo(false);setState(v);};
  useEffect(()=>{
    if(!cfg){setSync({status:"off"});return;}
    let alive=true;setSync({status:"connecting"});
    (async()=>{try{
      const r=await remoteGet(cfg);if(!alive)return;
      if(r.data){const v=sanitize(r.data);if(v){remoteJson.current=JSON.stringify(v);rev.current=r.rev;applyRemote(v);setSync({status:"synced",rev:r.rev,at:r.updatedAt});return;}}
      const p=await remotePut(cfg,state);if(!alive)return;remoteJson.current=JSON.stringify(state);rev.current=p.rev;setSync({status:"synced",rev:p.rev,at:p.updatedAt});
    }catch(e){if(alive)setSync({status:"error",err:String(e.message||e)});}})();
    return ()=>{alive=false;};
  },[cfg]);
  useEffect(()=>{
    if(!cfg)return;const js=JSON.stringify(state);if(js===remoteJson.current)return;   // unchanged / just-pulled → don't echo back
    clearTimeout(saveTimer.current);setSync(s=>s.status==="synced"?{...s,status:"saving"}:s);
    saveTimer.current=setTimeout(async()=>{try{const p=await remotePut(cfg,state);remoteJson.current=js;rev.current=p.rev;setSync({status:"synced",rev:p.rev,at:p.updatedAt});}
      catch(e){setSync(s=>({...s,status:"error",err:String(e.message||e)}));}},800);
    return ()=>clearTimeout(saveTimer.current);
  },[state,cfg]);
  useEffect(()=>{
    if(!cfg)return;
    const iv=setInterval(async()=>{try{
      const r=await remoteGet(cfg);
      if(r.rev>rev.current&&r.data){const v=sanitize(r.data);if(v){remoteJson.current=JSON.stringify(v);rev.current=r.rev;applyRemote(v);setSync({status:"synced",rev:r.rev,at:r.updatedAt});setToast("Updated from another device");}}
      else setSync(s=>(s.status==="offline"||s.status==="error")?{status:"synced",rev:rev.current}:s);
    }catch(e){setSync(s=>s.status==="saving"?s:{...s,status:"offline"});}},7000);
    return ()=>clearInterval(iv);
  },[cfg]);
  /* ── calendar feeds: pull, reconcile, and flag what she didn't ask for ──
     Every check is idempotent, so a missed hour or a double-check costs nothing. */
  const stateRef=useRef(state);stateRef.current=state;
  const statusRef=useRef(feedStatus);statusRef.current=feedStatus;
  const feedRun=useRef(false);
  const stamp=(id,patch)=>setFeedStatus(m=>{const n={...m,[id]:{...(m[id]||{}),...patch,at:new Date().toISOString()}};saveFeedStatus(n);return n;});
  const applyFeedText=React.useCallback((feed,text,manual)=>{
    if(!looksLikeICS(text)){
      stamp(feed.id,{ok:false,err:"that link didn’t return a calendar"});
      if(manual)setToast(`${feed.name} · that link didn’t return a calendar.`);
      return;
    }
    const parsed=feedEvents(text);
    const first=!(statusRef.current[feed.id]||{}).at;       // this device's first pull adopts quietly
    // peek at what this check would do; only touch the plan when it actually says something
    const cur=stateRef.current,live=(cur.feeds||[]).find(x=>x.id===feed.id)||feed;
    const peek=reconcile(cur,siteIndex(cur.sites),live,parsed,TODAY_S,{flag:!first});
    stamp(feed.id,{ok:true,count:parsed.events.length,err:null});
    const news=!reportEmpty(peek.report)||peek.report.surprises.length>0;
    if(news)
      mutate(s=>{const f=(s.feeds||[]).find(x=>x.id===feed.id)||live;
        const out=reconcile(s,siteIndex(s.sites),f,parsed,TODAY_S,{flag:!first});
        return withSurprises(out.state,out.report.surprises);});
    if(manual||news)
      setToast(`${feed.name} · ${first?`adopted ${parsed.events.length} shift${parsed.events.length===1?"":"s"}`:reportLine(peek.report)}`);
  },[]);
  const checkFeed=React.useCallback(async(feed,opts)=>{
    const manual=!(opts&&opts.silent);
    setFeedBusy(b=>({...b,[feed.id]:"checking"}));
    try{ applyFeedText(feed,await fetchFeedText(feed,syncCfg()),manual); }
    catch(e){
      const msg=String(e.message||e);
      stamp(feed.id,{ok:false,err:msg});
      if(manual)setToast(`${feed.name} · ${msg}`);
    }
    finally{setFeedBusy(b=>{const n={...b};delete n[feed.id];return n;});}
  },[applyFeedText]);
  const runDueFeeds=React.useCallback(async force=>{
    if(feedRun.current)return;feedRun.current=true;
    try{
      const feeds=(stateRef.current.feeds||[]).filter(f=>f.enabled!==false&&isFeedURL(f.url));
      for(const f of feeds)if(force||feedDue(f,statusRef.current[f.id]))await checkFeed(f,{silent:true});
    }finally{feedRun.current=false;}
  },[checkFeed]);
  // first pass waits for the shared-storage pull to land, so we reconcile against the shared plan
  useEffect(()=>{const t=setTimeout(()=>runDueFeeds(false),cfg?5000:1500);
    const iv=setInterval(()=>runDueFeeds(false),60000);
    return ()=>{clearTimeout(t);clearInterval(iv);};},[runDueFeeds,cfg]);

  const surprises=state.surprises||[];
  const sKey=surprises.map(x=>x.id).join("|");                  // a new flag re-opens the alert
  const showSurprise=!!sKey&&snooze!==sKey;
  const goToDay=d=>{setSnooze(sKey);setPanel(null);setSelWid(null);setSelTid(null);setSelected(d);
    const dd=pd(d);setVY([dd.getFullYear(),dd.getMonth()]);};

  const exportJSON=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="per-diem.json";a.click();};
  const importJSON=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=ev=>{try{const v=sanitize(JSON.parse(ev.target.result));past.current=[];setCanUndo(false);setState(v);setToast("Imported.");}
      catch(err){alert("Couldn’t read that file — wrong shape.");}};
    rd.readAsText(f);e.target.value="";};
  const share=()=>{const url=shareLink(state);if(!url){setToast("Share link unavailable (compressor not loaded).");return;}
    const big=url.length>12000,msg=`Link copied · ${url.length.toLocaleString()} chars${big?" · ⚠ long":""}`;
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>setToast(msg)).catch(()=>prompt("Copy this link:",url));
    else prompt("Copy this share link:",url);};

  return <div style={{fontFamily:MONO,color:C.ink,height:"100%",display:"flex",flexDirection:"column",background:C.bg}}>
    {toast&&<div style={{position:"fixed",bottom:mobile?70:18,left:"50%",transform:"translateX(-50%)",zIndex:400,
      background:C.ink,color:C.bg,fontSize:12,fontWeight:600,padding:"8px 14px",borderRadius:6,maxWidth:"90vw",textAlign:"center",
      boxShadow:"0 8px 24px rgba(0,0,0,.25)"}}>{toast}</div>}
    {tripDrag&&tripDrag.moved&&<div style={{position:"fixed",left:tripDrag.x+12,top:tripDrag.y+12,zIndex:500,pointerEvents:"none",
      background:C.ocean,color:"#fff",fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:6,boxShadow:"0 6px 18px rgba(0,0,0,.3)"}}>
      ✈ {tripDrag.name}{tripDrag.over?` → ${MON[pd(tripDrag.over).getMonth()]} ${pd(tripDrag.over).getDate()}`:""}</div>}
    {syncModal&&<SyncModal sync={sync} onClose={()=>setSyncModal(false)} onSaved={()=>setCfg(syncCfg())}/>}
    {showSurprise&&<SurpriseModal state={state} sIdx={sIdx} onClose={()=>setSnooze(sKey)} onGo={goToDay}
      onKeep={x=>mutate(s=>ackSurprises(s,[x.id]))}
      onDrop={x=>mutate(s=>rejectSurprise(s,x))}
      onKeepAll={()=>mutate(s=>ackSurprises(s,surprises.map(x=>x.id)))}/>}
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 14px",borderBottom:`1px solid ${C.line}`,background:C.panel,flexShrink:0,gap:8,flexWrap:"wrap"}}>
      <span style={{fontSize:15.5,fontWeight:900,letterSpacing:"-0.03em"}}>PER DIEM</span>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <span style={{fontSize:9.5,color:C.mute}}>today {TODAY_S}</span>
        {surprises.length>0&&<button onClick={()=>setSnooze("")} title="shifts that landed without a request"
          style={{fontFamily:MONO,fontSize:10.5,fontWeight:800,cursor:"pointer",borderRadius:20,padding:"3px 9px",
            border:`1px solid ${C.warn}`,background:"transparent",color:C.warn}}>⚠ {surprises.length}</button>}
        <Btn small onClick={()=>setMenu(true)}>☰ Menu</Btn>
        <input ref={fileRef} type="file" accept=".json,application/json" onChange={importJSON} style={{display:"none"}}/>
      </div>
    </div>
    {menu&&<div onClick={()=>setMenu(false)} style={{position:"fixed",inset:0,zIndex:600,background:"rgba(0,0,0,.35)",display:"flex",justifyContent:"flex-end"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:300,maxWidth:"86vw",height:"100%",background:C.panel,boxShadow:"-8px 0 24px rgba(0,0,0,.25)",overflow:"auto",display:"flex",flexDirection:"column"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",borderBottom:`1px solid ${C.line2}`}}>
          <b style={{fontSize:14}}>Menu</b>
          <button onClick={()=>setMenu(false)} style={{fontFamily:MONO,fontSize:14,border:"none",background:"transparent",color:C.gray,cursor:"pointer"}}>✕</button></div>
        <div style={{padding:"8px 10px"}}>
          <MenuItem on={panel===null} onClick={()=>openPanel(null)}>▦ Calendar</MenuItem>
          {MENU_SECTIONS.map(([id,label])=><MenuItem key={id} on={panel===id} onClick={()=>openPanel(id)}>{label}</MenuItem>)}
        </div>
        <div style={{borderTop:`1px solid ${C.line2}`,padding:"8px 10px"}}>
          <div style={menuHdr}>Data</div>
          <MenuItem onClick={()=>{share();setMenu(false);}}>Share link</MenuItem>
          <MenuItem onClick={()=>{exportJSON();setMenu(false);}}>Export JSON</MenuItem>
          <MenuItem onClick={()=>fileRef.current.click()}>Import JSON</MenuItem>
          <MenuItem onClick={()=>{setSyncModal(true);setMenu(false);}}>Shared storage — {(SYNC_UI[sync.status]||SYNC_UI.off).t}</MenuItem>
          <MenuItem onClick={()=>openPanel("feeds")}>Calendar feeds — {(state.feeds||[]).length?`${(state.feeds||[]).length} linked`:"none yet"}</MenuItem>
          <MenuItem onClick={()=>{setMenu(false);runDueFeeds(true);}}>Check feeds now</MenuItem>
        </div>
        <div style={{borderTop:`1px solid ${C.line2}`,padding:"8px 10px"}}>
          <div style={menuHdr}>System</div>
          <MenuItem onClick={cycle}>Theme — {theme} {themeIcon}</MenuItem>
          <MenuItem onClick={()=>{if(confirm("Reset to seed data?")){past.current=[];setCanUndo(false);setState(seedState());setMenu(false);}}}>Reset to sample data</MenuItem>
        </div>
      </div>
    </div>}
    {panel
      ? <div style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",borderBottom:`1px solid ${C.line}`,background:C.panel,flexShrink:0}}>
            <button onClick={()=>setPanel(null)} style={{fontFamily:MONO,fontSize:12.5,fontWeight:700,border:`1px solid ${C.line}`,background:C.panel,color:C.ink,borderRadius:6,cursor:"pointer",padding:"4px 9px"}}>‹ Calendar</button>
            <b style={{fontSize:13.5}}>{PANEL_TITLE[panel]}</b></div>
          <div style={{flex:1,minHeight:0,overflow:"auto"}}>
            {panel==="sites"?<SitesTab state={state} mutate={mutate}/>
              :panel==="feeds"?<FeedsTab state={state} mutate={mutate} busy={feedBusy} status={feedStatus} hasStore={!!cfg}
                 onCheck={f=>checkFeed(f)} onPaste={(f,t)=>applyFeedText(f,t,true)} onOpenStore={()=>setSyncModal(true)}/>
              :<TripsCalsTab state={state} mutate={mutate} only={panel}/>}
          </div>
        </div>
      : <>
        <DrawerStrip state={state} mutate={mutate} goAddTrip={()=>openPanel("trips")} goAddCal={()=>openPanel("family")} onGrabTrip={beginTripDrag}/>
        <Banner agg={agg} goal={state.settings.goal} mobile={mobile} year={viewYM.slice(0,4)}/>
        <MonthBar agg={agg} viewYM={viewYM} mobile={mobile}/>
        <div style={{flex:1,minHeight:0,display:"flex",flexDirection:mobile?"column":"row",overflow:"hidden"}}>
          <div style={{flex:mobile?(collapsed?"1 1 auto":"1 1 60%"):"1 1 0",minWidth:0,minHeight:0,overflow:"auto"}}>
            <CalendarSurface state={state} sIdx={sIdx} mobile={mobile} mutate={mutate} viewY={viewY} viewM={viewM} setView={setView}
              tool={tool} setTool={setTool} selected={selected} onTap={onTap} onUndo={undo} canUndo={canUndo}
              winBy={winBy} travelBy={travelBy} placing={placingSet} onCreateWindow={onCreateWindow}
              selTid={selTid} selWid={selWid} onEdge={beginEdge} onGrabTravel={beginTravelDrag}/>
          </div>
          {/* info box — collapsible; a thin bar when collapsed */}
          {collapsed
            ? <div onClick={()=>setCollapsed(false)} style={mobile
                ?{flex:"0 0 auto",borderTop:`1px solid ${C.line}`,background:C.panel2,padding:"6px 12px",cursor:"pointer",fontSize:11,fontWeight:700,color:C.gray,display:"flex",alignItems:"center",gap:6}
                :{flex:"0 0 24px",borderLeft:`1px solid ${C.line}`,background:C.panel2,cursor:"pointer",writingMode:"vertical-rl",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:C.gray,gap:6}}>
                ‹ info box{selected?` · ${MON[pd(selected).getMonth()]} ${pd(selected).getDate()}`:""}</div>
            : <div style={mobile
                ?{flex:"0 0 auto",maxHeight:"42%",overflow:"auto",borderTop:`1px solid ${C.line}`,background:C.panel}
                :{flex:"0 0 380px",overflow:"auto",borderLeft:`1px solid ${C.line}`,background:C.panel,position:"relative"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:6,padding:"5px 10px 0"}}>
                {selected&&<button onClick={()=>setSelected(null)} title="deselect" style={{fontFamily:MONO,fontSize:11,fontWeight:700,border:`1px solid ${C.line}`,background:C.panel,color:C.gray,borderRadius:5,cursor:"pointer",padding:"2px 7px"}}>no date</button>}
                <button onClick={()=>setCollapsed(true)} title="collapse" style={{fontFamily:MONO,fontSize:12,fontWeight:700,border:`1px solid ${C.line}`,background:C.panel,color:C.gray,borderRadius:5,cursor:"pointer",padding:"2px 8px"}}>{mobile?"▾ hide":"› hide"}</button>
              </div>
              {selWid&&state.windows.find(w=>w.id===selWid)
                ? <WindowReadout state={state} sIdx={sIdx} wid={selWid} mutate={mutate} onScheduled={()=>setSelWid(null)}/>
                : selTid&&(state.trips||[]).find(t=>t.id===selTid)
                ? <TripReadout state={state} tid={selTid} mutate={mutate} onClose={()=>setSelTid(null)}/>
                : <Readout state={state} sIdx={sIdx} selected={selected} mutate={mutate} mobile={mobile} setSelected={setSelected} onAddWindow={addWindowAt}/>}
            </div>}
        </div>
      </>}
  </div>;
}
class Boundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(e,i){console.error("crash",e,i);}
  render(){if(!this.state.err)return this.props.children;
    return <div style={{fontFamily:MONO,maxWidth:440,margin:"12vh auto",padding:"0 20px",textAlign:"center",color:C.ink}}>
      <div style={{fontSize:16,fontWeight:800,marginBottom:8}}>Something went sideways.</div>
      <button onClick={()=>{try{localStorage.removeItem("perDiemNext");}catch(_){}location.reload();}}
        style={{fontFamily:MONO,fontSize:12,fontWeight:700,padding:"6px 12px",borderRadius:4,cursor:"pointer",border:`1px solid ${C.ink}`,background:C.ink,color:C.bg}}>Reset & reload</button>
    </div>;}
}
ReactDOM.createRoot(document.getElementById("root")).render(<Boundary><App/></Boundary>);
</script>
</body>
</html>
